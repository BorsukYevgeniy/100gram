services:
  app:
    build:
      dockerfile: Dockerfile
    ports:
      - '${APP_PORT}:${APP_PORT}'
    env_file:
      - .env.dev

    depends_on:
      - minio
      - postgres
      - redis

  postgres:
    image: postgres:18-alpine
    ports:
      - '${POSTGRES_PORT}:${POSTGRES_PORT}'
    volumes:
      - pg-data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

  redis:
    image: redis:8.10-alpine
    ports:
      - '${REDIS_PORT}:${REDIS_PORT}'
    volumes:
      - redis-data:/data

  minio:
    image: quay.io/minio/aistor/minio:latest
    volumes:
      - minio-data:/data
      - ./minio.license:/minio.license
    ports:
      - '${MINIO_API_PORT}:${MINIO_API_PORT}'
      - '${MINIO_WEB_PORT}:${MINIO_WEB_PORT}'
    command: server /data --license /minio.license

volumes:
  pg-data:
  redis-data:
  minio-data:
