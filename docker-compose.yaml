services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - '${BACKEND_PORT}:${BACKEND_PORT}'
    env_file:
      - ./backend/.env.dev
    depends_on:
      - minio
      - postgres
      - redis

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '${FRONTEND_PORT}:${FRONTEND_PORT}'
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  postgres:
    image: postgres:18-alpine
    ports:
      - '${POSTGRES_PORT}:${POSTGRES_PORT}'
    volumes:
      - pg-data:/var/lib/postgresql

  redis:
    image: redis:8.10-alpine
    ports:
      - '${REDIS_PORT}:${REDIS_PORT}'
    volumes:
      - redis-data:/data

  minio:
    image: quay.io/minio/aistor/minio:latest
    volumes:
      - minio-data:/data
      - ./backend/${MINIO_LICENSE_PATH}:/minio.license:ro
    ports:
      - '${MINIO_API_PORT}:${MINIO_API_PORT}'
      - '${MINIO_WEB_PORT}:${MINIO_WEB_PORT}'
    command: server /data --license ./minio.license

volumes:
  pg-data:
  redis-data:
  minio-data:
